# Hält das Supabase-Free-Projekt aktiv: eine kleine Datenbank-Abfrage pro Tag.
# Einrichtung: Repo → Settings → Secrets and variables → Actions → zwei Secrets anlegen:
#   SUPABASE_URL       (z. B. https://abcdefghij.supabase.co – ohne /rest/v1/ am Ende)
#   SUPABASE_ANON_KEY  (anon public Key oder Publishable Key sb_publishable_…)
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 * * *"   # täglich 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Secrets SUPABASE_URL und/oder SUPABASE_ANON_KEY fehlen (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          URL="${URL%/}"; URL="${URL%/rest/v1}"
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            "$URL/rest/v1/boards?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Accept: application/json")
          echo "HTTP $code"; head -c 300 /tmp/body; echo
          # 200 = Abfrage lief (auch ein leeres [] zählt als Datenbankzugriff)
          test "$code" = "200"
