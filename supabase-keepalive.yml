# Hält das Supabase-Free-Projekt aktiv: eine kleine Datenbank-Abfrage pro Tag.
# Einrichtung: Repo → Settings → Secrets and variables → Actions → zwei Secrets anlegen:
#   SUPABASE_URL       (z. B. https://abcdefghij.supabase.co)
#   SUPABASE_ANON_KEY  (anon public Key)
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 * * *"   # täglich 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/boards?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          test "$code" = "200"
